<template>
    <template if:true={isLoaded}>
        <section
            class="slds-notify slds-notify_alert slds-theme_shade slds-m-around_medium"
            role="alert"
        >
            <div class="slds-notify__content slds-text-align_center">
                <h2 class="slds-text-heading_small slds-text-color_default slds-text-bold">
                    {rollupSubMembers} out of {maxSubMembers} members are added.
                </h2>
            </div>
        </section>
    </template>
</template>
